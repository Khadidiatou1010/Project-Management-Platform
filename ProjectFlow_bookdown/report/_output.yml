bookdown::gitbook:
  css: "style.css"
  config:
    toc:
      collapse: section
      before: |
        <li><a href="./">ProjectFlow — Rapport</a></li>
    download: ["pdf", "epub"]
  split_by: "section"
  number_sections: true

bookdown::pdf_book:
  latex_engine: xelatex
  keep_tex: true
  number_sections: true
  toc: true

bookdown::epub_book:
  number_sections: true